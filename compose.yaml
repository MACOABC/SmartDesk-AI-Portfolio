services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      N8N_DB_NAME: ${N8N_DB_NAME:?N8N_DB_NAME must be set}
      N8N_DB_USER: ${N8N_DB_USER:?N8N_DB_USER must be set}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD must be set}
      SMARTDESK_DB_NAME: ${SMARTDESK_DB_NAME:?SMARTDESK_DB_NAME must be set}
      SMARTDESK_DB_USER: ${SMARTDESK_DB_USER:?SMARTDESK_DB_USER must be set}
      SMARTDESK_DB_PASSWORD: ${SMARTDESK_DB_PASSWORD:?SMARTDESK_DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - ./db/apply-migrations.sh:/docker-entrypoint-initdb.d/20-apply-migrations.sh:ro
      - ./db/migrations:/opt/smartdesk/migrations:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - database
      - bi_access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.6
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:?N8N_DB_NAME must be set}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:?N8N_DB_USER must be set}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD must be set}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_HOST: ${N8N_HOST:?N8N_HOST must be set}
      N8N_PORT: ${N8N_PORT:?N8N_PORT must be set}
      N8N_PROTOCOL: ${N8N_PROTOCOL:?N8N_PROTOCOL must be set}
      N8N_WEBHOOK_URL: https://${SMARTDESK_HOST:?SMARTDESK_HOST must be set}/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /opt/smartdesk/prompts/ticket-classification
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMARTDESK_ADMIN_TOKEN: ${SMARTDESK_ADMIN_TOKEN:?SMARTDESK_ADMIN_TOKEN must be set}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:?GENERIC_TIMEZONE must be set}
      TZ: ${TZ:?TZ must be set}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./prompts/ticket-classification:/opt/smartdesk/prompts/ticket-classification:ro
    networks:
      - app
      - database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      SMARTDESK_HOST: ${SMARTDESK_HOST:?SMARTDESK_HOST must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  app:
  database:
    internal: true
  bi_access:
