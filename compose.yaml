services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      N8N_DB_NAME: ${N8N_DB_NAME:?N8N_DB_NAME must be set}
      N8N_DB_USER: ${N8N_DB_USER:?N8N_DB_USER must be set}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD must be set}
      SMARTDESK_DB_NAME: ${SMARTDESK_DB_NAME:?SMARTDESK_DB_NAME must be set}
      SMARTDESK_DB_USER: ${SMARTDESK_DB_USER:?SMARTDESK_DB_USER must be set}
      SMARTDESK_DB_PASSWORD: ${SMARTDESK_DB_PASSWORD:?SMARTDESK_DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:

networks:
  database:
    internal: true
