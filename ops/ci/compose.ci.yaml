name: smartdesk-ci

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ci_admin
      POSTGRES_PASSWORD: ci_admin_local_only
      POSTGRES_DB: postgres
      N8N_DB_NAME: n8n_ci
      N8N_DB_USER: n8n_ci_user
      N8N_DB_PASSWORD: n8n_ci_local_only
      SMARTDESK_DB_NAME: smartdesk_ci
      SMARTDESK_DB_USER: smartdesk_ci_user
      SMARTDESK_DB_PASSWORD: smartdesk_ci_local_only
    volumes:
      - ci_postgres_data:/var/lib/postgresql/data
      - ../../db/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - ../../db/apply-migrations.sh:/docker-entrypoint-initdb.d/20-apply-migrations.sh:ro
      - ../../db/migrations:/opt/smartdesk/migrations:ro
      - ../../db/tests:/opt/smartdesk/tests:ro
      - ../../sql/analytics:/opt/smartdesk/analytics:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=ci_admin --dbname=postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  ci_postgres_data:
